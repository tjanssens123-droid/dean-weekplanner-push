<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Dean Weekplanner Push</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f5f7fb;color:#101828}
    .wrap{max-width:680px;margin:auto;padding:20px}
    .card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px #10182812}
    button{font:inherit;border-radius:12px;padding:12px;background:#111827;color:#fff;border:0;font-weight:650;cursor:pointer;margin:4px 4px 4px 0}
    .muted{color:#667085}.ok{color:#067647}.warn{color:#b54708}.small{font-size:13px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Dean Weekplanner</h1>
  <p class="muted">Pushmeldingen</p>

  <div class="card">
    <h2>meldingen aanzetten</h2>
    <p class="muted">iedereen die hier één keer op drukt krijgt daarna automatisch de meldingen</p>
    <button id="enable">meldingen aanzetten</button>
    <button id="selftest">test op dit toestel</button>
    <p id="status" class="small"></p>
  </div>

  <div class="card">
    <h2>test naar iedereen</h2>
    <p class="muted">hiermee testen we of alle aangemelde telefoons een pushmelding krijgen</p>
    <button id="broadcast">stuur test naar iedereen</button>
    <p id="broadcastStatus" class="small"></p>
  </div>

  <script>
    const PUBLIC_KEY='BBtMg90-ouJN-M5Hobgj73W8b2hZGVG4GKMd321J5hCN0AAMf1aqWPn3JZgX6zGXrjXDxGqH-T1qkoeWnBXUSOg';
    const SUPABASE_URL='https://kfrruzezmdiaoekucmnl.supabase.co';
    const SUPABASE_KEY='sb_publishable_4Mx8mLcyFuwbLezyqYVZLA_lO8_zsTe';
    const $=id=>document.getElementById(id);
    let reg;

    function toUint8Array(value){
      const padding='='.repeat((4-value.length%4)%4);
      const base64=(value+padding).replace(/-/g,'+').replace(/_/g,'/');
      const raw=atob(base64);
      return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
    }

    async function saveSubscription(sub){
      const j=sub.toJSON();
      const r=await fetch(SUPABASE_URL+'/rest/v1/push_subscriptions?on_conflict=endpoint',{
        method:'POST',
        headers:{
          'apikey':SUPABASE_KEY,
          'Authorization':'Bearer '+SUPABASE_KEY,
          'Content-Type':'application/json',
          'Prefer':'resolution=merge-duplicates,return=minimal'
        },
        body:JSON.stringify({
          endpoint:j.endpoint,
          p256dh:j.keys.p256dh,
          auth:j.keys.auth,
          user_agent:navigator.userAgent,
          updated_at:new Date().toISOString()
        })
      });
      if(!r.ok) throw new Error('opslaan van meldingen is niet gelukt');
    }

    async function getSubscription(){
      if(!reg) throw new Error('service worker is nog niet klaar');
      let sub=await reg.pushManager.getSubscription();
      if(sub) await sub.unsubscribe();
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:toUint8Array(PUBLIC_KEY)
      });
      await saveSubscription(sub);
      return sub;
    }

    function updateStatus(){
      const p=Notification.permission;
      $('status').textContent=p==='granted'?'meldingen staan aan ✅':p==='denied'?'meldingen zijn geblokkeerd':'meldingen staan nog niet aan';
      $('status').className='small '+(p==='granted'?'ok':'warn');
    }

    async function init(){
      if('serviceWorker' in navigator){
        reg=await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;
      }
      updateStatus();
    }

    $('enable').onclick=async()=>{
      try{
        const p=await Notification.requestPermission();
        if(p==='granted'){
          await getSubscription();
          $('status').textContent='meldingen staan aan en dit toestel is aangemeld ✅';
          $('status').className='small ok';
        } else updateStatus();
      }catch(e){
        $('status').textContent=e.message;
        $('status').className='small warn';
      }
    };

    $('selftest').onclick=()=>{
      if(Notification.permission!=='granted') return alert('zet eerst meldingen aan');
      reg.showNotification('Dean Weekplanner',{body:'testmelding werkt ✅',icon:'/icon.svg',data:{url:'/'}})
    };

    $('broadcast').onclick=async()=>{
      try{
        $('broadcastStatus').textContent='versturen...';
        const r=await fetch('/api/push',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            title:'Dean Weekplanner',
            body:'testmelding naar iedereen ✅',
            url:'/'
          })
        });
        const data=await r.json();
        if(!r.ok) throw new Error(data.error||'versturen mislukt');
        $('broadcastStatus').textContent='verstuurd naar '+data.sent+' toestel(len) ✅';
        $('broadcastStatus').className='small ok';
      }catch(e){
        $('broadcastStatus').textContent=e.message;
        $('broadcastStatus').className='small warn';
      }
    };

    init();
  </script>
</div>
</body>
</html>
